text = "Okuma salonunda birçok dilde yazılmış kitap yan yana durur. Her paragrafın kendine ait bir ritmi vardır ve her yazı sistemi harflerin biçimini ve konumunu farklı kurallarla belirler. Okur bir bölümden diğerine geçerken metnin bütünlüğünü korumak ister. Bu deney için çeşitli yazı tipleriyle uzun bir belge hazırladık. Aynı içeriği daha kısa parçalara ayırarak işlem süresini yeniden ölçüyoruz. Boşluklar, noktalama işaretleri ve Türkçeye özgü harfler korunuyor. Bütün bölümlerin sırası her ölçümde aynı kalıyor. "
