[[cases.runs]]
font = "latin"
text = "W czytelni obok siebie leżą książki napisane w wielu językach. Każdy akapit ma własny rytm, a każdy system pisma wymaga innego sposobu określania kształtu i położenia liter. Czytelnik przechodzi między częściami dokumentu i zachowuje ciągłość lektury. W tym doświadczeniu przygotowaliśmy długi tekst z kilkoma rodzinami krojów pisma. Następnie dzielimy tę samą treść na krótsze fragmenty i ponownie mierzymy czas przetwarzania. Spacje, znaki diakrytyczne oraz interpunkcja pozostają na swoich miejscach, podobnie jak kolejność wszystkich akapitów. "
