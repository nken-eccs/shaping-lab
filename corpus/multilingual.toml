[[cases.runs]]
font = "serif"
text = "Nella sala di lettura si incontrano libri scritti in molte lingue. Ogni paragrafo ha un ritmo proprio e ogni sistema di scrittura richiede regole particolari per la forma e la posizione delle lettere. Il lettore passa da una sezione alla successiva senza perdere il filo del documento. Per questa prova abbiamo preparato un testo lungo con diverse famiglie di caratteri. Lo stesso contenuto viene poi diviso in parti più brevi per misurare nuovamente il tempo di elaborazione. Gli spazi, gli accenti e i segni di punteggiatura rimangono presenti e tutti i paragrafi conservano il loro ordine. "
direction = "ltr"
script = "Latn"
language = "it"

[[cases.runs]]
font = "roboto"
text = "Di ruang baca terdapat buku dalam banyak bahasa yang diletakkan berdampingan. Setiap paragraf memiliki iramanya sendiri dan setiap sistem tulisan mempunyai aturan untuk menentukan bentuk serta posisi huruf. Pembaca berpindah dari satu bagian ke bagian lain tanpa kehilangan hubungan antarkalimat. Dalam percobaan ini kami memakai dokumen panjang dengan beberapa jenis huruf yang telah dipilih. Isi yang sama kemudian dibagi menjadi bagian lebih pendek untuk mengukur waktu pemrosesan. Spasi, tanda baca dan urutan paragraf tetap dipertahankan selama seluruh pengukuran. "
direction = "ltr"
script = "Latn"
language = "id"

[[cases.runs]]
font = "serif"
text = "In de leeszaal liggen boeken in veel verschillende talen naast elkaar. Elke alinea heeft een eigen ritme en elk schrift vraagt om een passende vorm en plaatsing van de letters. De lezer gaat van het ene gedeelte naar het volgende en houdt de samenhang van het document vast. Voor deze proef gebruiken we een lange tekst met verschillende lettertypen. Daarna verdelen we dezelfde inhoud in kortere stukken om de verwerkingstijd opnieuw te meten. Spaties, accenten en leestekens blijven behouden en de volgorde van alle alinea’s verandert tijdens de metingen niet. "
direction = "ltr"
script = "Latn"
language = "nl"
