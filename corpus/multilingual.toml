[[cases.runs]]
font = "devanagari"
text = "पुस्तकालयको टेबलमा विभिन्न भाषामा लेखिएका पुस्तकहरू राखिएका छन्। प्रत्येक अनुच्छेदको आफ्नै लय हुन्छ र प्रत्येक लिपिमा अक्षरको आकार तथा स्थान मिलाउने तरिका फरक हुन्छ। पाठक एउटा खण्डबाट अर्को खण्डमा जाँदा विषयको क्रम बुझ्न सक्नुपर्छ। यस प्रयोगमा धेरै अक्षरशैली प्रयोग गरेर लामो दस्तावेज तयार गरिएको छ। त्यसपछि उही सामग्रीलाई छोटा भागमा विभाजन गरी प्रशोधनको समय तुलना गरिन्छ। मात्रा, संयुक्त अक्षर, खाली ठाउँ र विराम चिह्न सबैलाई जस्ताको तस्तै राखिन्छ र अनुच्छेदहरूको क्रम परिवर्तन गरिँदैन। "
direction = "ltr"
script = "Deva"
language = "ne"

[[cases.runs]]
font = "latin"
