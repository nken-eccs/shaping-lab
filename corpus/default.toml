[[cases]]
id = "empty"
description = "Empty input"
[[cases.runs]]
font = "latin"
text = ""
direction = "ltr"
script = "Latn"
language = "en"

[[cases]]
id = "latin-ligatures"
description = "Latin ligatures and kerning"
[[cases.runs]]
font = "latin"
text = "office affine ffi AVATAR To Wa"
direction = "ltr"
script = "Latn"
language = "en"

[[cases]]
id = "latin-no-ligatures"
description = "Ligatures disabled"
[[cases.runs]]
font = "latin"
text = "office affine ffi AVATAR To Wa"
direction = "ltr"
script = "Latn"
language = "en"
features = [{ tag = "liga", value = 0 }, { tag = "clig", value = 0 }]

[[cases]]
id = "latin-range-feature"
description = "Feature range in UTF-8 bytes"
[[cases.runs]]
font = "latin"
text = "é office affine"
direction = "ltr"
script = "Latn"
language = "en"
features = [{ tag = "liga", value = 0, start = 3, end = 9 }]

[[cases]]
id = "latin-combining"
description = "Combining marks and normalization"
[[cases.runs]]
font = "latin"
text = "á ë ñ Å á é Å"
direction = "ltr"
script = "Latn"
language = "en"
cluster_level = "monotone-characters"
flags = ["unsafe-to-concat"]

[[cases]]
id = "latin-variable"
description = "Weight and width variations"
[[cases.runs]]
font = "latin"
text = "office AVATAR Typography"
direction = "ltr"
script = "Latn"
language = "en"
variations = { wght = 725.0, wdth = 80.0 }

