text = "السَّلَامُ عَلَيْكُمْ العربية"
direction = "rtl"
script = "Arab"
language = "ar"
flags = ["unsafe-to-concat", "safe-to-insert-tatweel"]

[[cases]]
id = "arabic-context"
description = "Arabic run boundaries with context"
[[cases.runs]]
