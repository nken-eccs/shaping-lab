[workspace]
members = ["core"]
default-members = [".", "core"]
resolver = "3"

[package]
name = "shaping-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "shape-lab"

[[bin]]
name = "shape-lab"
path = "src/main.rs"

[[bench]]
name = "shaping"
harness = false

[features]
trace = ["shaping-core/trace"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
shaping-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[build-dependencies]
cc = "1"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
debug = 1

[profile.bench]
debug = 1

[profile.profiling]
inherits = "release"
debug = 2
strip = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
